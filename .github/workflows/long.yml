name: Vidéo longue (collecte 10h -> publication 11h)
# 09h UTC = 10h Paris en hiver. Fenêtre d'actu : veille 10h -> jour 10h.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      script: { description: 'script JSON (validation)', required: false, default: '' }
      tag: { description: 'tag release', required: false, default: '' }
      lane: { description: 'A ou B', required: false, default: 'A' }
permissions:
  contents: write
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-roboto
      - run: pip install pillow edge-tts numpy
      - name: Collecte (actu des 24 dernières heures)
        if: ${{ inputs.script == '' }}
        env: { MODE: long }
        run: python collect.py
      - name: Montage (recette v6)
        env:
          SCRIPT_FILE: ${{ inputs.script }}
          USED_FILE: used_clips_${{ inputs.lane }}.json
          PARITY: ${{ inputs.lane == 'A' && '0' || '1' }}
          MODE: long
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python render.py
      - name: Conserver la vidéo du jour
        uses: actions/upload-artifact@v4
        with:
          name: video-long-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/meta.json
          retention-days: 7
      - name: Publier (Release + Make)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          D=$(ls -d out/*-long 2>/dev/null | tail -1)
          [ -n "$D" ] && [ -f "$D/video.mp4" ] || { echo "pas de vidéo"; exit 0; }
          TAG="${{ inputs.tag }}"; [ -n "$TAG" ] || TAG="long-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$D/video.mp4" "$D/cover.jpg" "$D/meta.json" "$D/subs.srt" --title "$TAG" --notes "Vidéo long automatique"
          [ -n "${{ inputs.script }}" ] && { echo "mode validation : aucune publication"; exit 0; }
          B="https://github.com/${{ github.repository }}/releases/download/$TAG"
          # Publication DIRECTE (gratuite, sans quota) : YouTube + Facebook. Make = secours uniquement.
          SKIP=false; python publish.py "$D" || python publish.py "$D" && SKIP=true || true
          FBD=false; python publish_meta.py "$D" fblong "$B/video.mp4" && FBD=true || true
          [ -n "$HOOK" ] || { echo "MAKE_WEBHOOK_URL absent : secours Make non envoye"; exit 0; }
          if [ "$FBD" = true ] && [ "$SKIP" = true ]; then echo "Tout publie en direct : Make non sollicite"; exit 0; fi
          # Si Facebook est deja parti mais pas YouTube : on laisse Make faire YouTube (full=true, la route Facebook "longue" serait doublee => on ne l'appelle que si Facebook a echoue)
          [ "$FBD" = true ] && { echo "YouTube direct a echoue, Facebook ok : secours YouTube non automatise ici"; exit 1; }
          jq -n --argjson skip "$SKIP" --argjson full true --arg mode "long" --arg v "$B/video.mp4" --arg c "$B/cover.jpg" \
            --arg ig "$(python igtext.py "$D")" --slurpfile m "$D/meta.json" \
            '{full:$full, skip_youtube:$skip, mode:$mode, video_url:$v, cover_url:$c, title:$m[0].title, description:$m[0].description, tags:$m[0].tags, fb_text:($m[0].description[0:2000]), ig_text:$ig, pinned_comment:$m[0].pinned_comment}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$HOOK"
      - name: Registre clips (validation)
        if: ${{ inputs.script != '' }}
        run: |
          git config user.name "de-auto"; git config user.email "de-auto@users.noreply.github.com"
          git add used_clips_*.json; git commit -qm "clips ${{ inputs.tag }}" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep 5; done
      - name: Journal
        if: ${{ inputs.script == '' }}
        run: |
          git config user.name "de-auto"; git config user.email "de-auto@users.noreply.github.com"
          D=$(ls -d out/*-long 2>/dev/null | tail -1); [ -n "$D" ] && python blog.py "$D" || true
          git add history.json log.csv topic.json used_clips.json docs 2>/dev/null || true
          git commit -m "Journal vidéo longue" || true
          git push || true
