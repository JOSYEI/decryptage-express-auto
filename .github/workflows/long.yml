name: Vidéo longue (collecte 10h -> publication 11h)
# 09h UTC = 10h Paris en hiver. Fenêtre d'actu : veille 10h -> jour 10h.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-roboto
      - run: pip install pillow edge-tts numpy
      - name: Collecte (actu des 24 dernières heures)
        env: { MODE: long }
        run: python collect.py
      - name: Montage (recette v6)
        env:
          MODE: long
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python render.py
      - name: Conserver la vidéo du jour
        uses: actions/upload-artifact@v4
        with:
          name: video-long-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/meta.json
          retention-days: 7
      - name: Publier (Release + Make)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          D=$(ls -d out/*-long 2>/dev/null | tail -1)
          [ -n "$D" ] && [ -f "$D/video.mp4" ] || { echo "pas de vidéo"; exit 0; }
          TAG="long-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$D/video.mp4" "$D/cover.jpg" "$D/meta.json" --title "$TAG" --notes "Vidéo long automatique"
          B="https://github.com/${{ github.repository }}/releases/download/$TAG"
          [ -n "$HOOK" ] || { echo "MAKE_WEBHOOK_URL absent : publication non envoyée"; exit 0; }
          # Rotation fixe : la vidéo longue est publiée par Buffer (Facebook + YouTube), pas par Make
          echo "Longue : publication confiée à Buffer (tâche planifiée 10h30)"; exit 0
          SKIP=false; python publish.py "$D" && SKIP=true || true
          jq -n --argjson skip "$SKIP" --arg mode "long" --arg v "$B/video.mp4" --arg c "$B/cover.jpg" \
            --arg ig "$(python igtext.py "$D")" --slurpfile m "$D/meta.json" \
            '{skip_youtube:$skip, mode:$mode, video_url:$v, cover_url:$c, title:$m[0].title, description:$m[0].description, tags:$m[0].tags, fb_text:($m[0].description[0:2000]), ig_text:$ig, pinned_comment:$m[0].pinned_comment}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$HOOK"
      - name: Journal
        run: |
          git config user.name "de-auto"; git config user.email "de-auto@users.noreply.github.com"
          git add history.json log.csv topic.json used_clips.json 2>/dev/null || true
          git commit -m "Journal vidéo longue" || true
          git push || true
