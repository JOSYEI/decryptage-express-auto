name: Plan (rendu d'un script écrit à la main, sans publication)
on:
  workflow_dispatch:
    inputs:
      plan: { description: "Fichier plans/xxx.json", required: true }
      mode: { description: "short ou long", required: true, default: "long" }
      voice: { description: "Voix edge-tts", required: false, default: "fr-FR-VivienneMultilingualNeural" }
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-roboto
      - run: pip install pillow edge-tts numpy
      - name: Montage
        env:
          MODE: ${{ inputs.mode }}
          PLAN_FILE: ${{ inputs.plan }}
          VOICE: ${{ inputs.voice }}
        run: python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/cover.jpg
            out/*/meta.json
            out/*/subs.srt
          retention-days: 14
