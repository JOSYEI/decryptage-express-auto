name: Short (collecte 1 h avant publication)
# Heures de Paris en hiver (UTC+1). Collecte : 23h 03h 07h 11h 15h 19h -> publication 00h 04h 08h 12h 16h 20h.
# 6 Shorts par jour, toutes les 4 heures (le cloud n'utilise pas le quota de Claude).
on:
  schedule:
    - cron: "0 22 * * *"   # collecte 23h Paris -> Short 00h
    - cron: "0 2 * * *"    # collecte 03h -> Short 04h
    - cron: "0 6 * * *"    # collecte 07h -> Short 08h
    - cron: "0 10 * * *"   # collecte 11h -> Short 12h
    - cron: "0 14 * * *"   # collecte 15h -> Short 16h
    - cron: "0 18 * * *"   # collecte 19h -> Short 20h
  workflow_dispatch:
permissions:
  contents: write
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-roboto
      - run: pip install pillow edge-tts numpy
      - name: Collecte (actu des 60 dernières minutes)
        env: { MODE: short }
        run: python collect.py
      - name: Montage (recette v6)
        env:
          MODE: short
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python render.py
      - name: Conserver la vidéo du jour
        uses: actions/upload-artifact@v4
        with:
          name: video-short-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/meta.json
          retention-days: 7
      - name: Publier (Release + Make)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          D=$(ls -d out/*-short 2>/dev/null | tail -1)
          [ -n "$D" ] && [ -f "$D/video.mp4" ] || { echo "pas de vidéo"; exit 0; }
          TAG="short-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$D/video.mp4" "$D/cover.jpg" "$D/meta.json" "$D/subs.srt" --title "$TAG" --notes "Vidéo short automatique"
          B="https://github.com/${{ github.repository }}/releases/download/$TAG"
          # Publication DIRECTE (gratuite, sans quota) : YouTube, Facebook reel, Instagram reel. Make = secours uniquement.
          SKIP=false; python publish.py "$D" || python publish.py "$D" && SKIP=true || true
          # Facebook limite les publications (erreur 368 "spam" le 24/11) : reel Facebook seulement 3 fois/jour (Shorts 08h, 16h, 20h) + la longue = 4 posts/jour.
          H=$(date -u +%H); case "$H" in 06|07|14|15|18|19) FBSLOT=true;; *) FBSLOT=false;; esac
          FBD=false; [ "$FBSLOT" = true ] && { python publish_meta.py "$D" fb "$B/video.mp4" && FBD=true || true; }
          IGD=false; python publish_meta.py "$D" ig "$B/video.mp4" && IGD=true || true
          [ -n "$HOOK" ] || { echo "MAKE_WEBHOOK_URL absent : secours Make non envoye"; exit 0; }
          # Make ne publie que ce que le direct n'a pas pu faire : full=false coupe YouTube+Facebook, ig_metricool=true coupe Instagram
          if [ "$FBSLOT" = false ]; then FBD=true; fi  # créneau sans Facebook : rien à faire côté Facebook
          if [ "$FBD" = true ] && [ "$IGD" = true ] && [ "$SKIP" = true ]; then echo "Tout publie en direct : Make non sollicite"; exit 0; fi
          if [ "$FBD" = true ]; then FULL=false; else FULL=true; fi
          if [ "$IGD" = true ]; then IGM=true; else IGM=false; fi
          jq -n --argjson full "$FULL" --argjson igm "$IGM" --argjson skip "$SKIP" --arg mode "short" --arg v "$B/video.mp4" --arg c "$B/cover.jpg" \
            --arg ig "$(python igtext.py "$D")" --slurpfile m "$D/meta.json" \
            '{full:$full, ig_metricool:$igm, skip_youtube:$skip, mode:$mode, video_url:$v, cover_url:$c, title:$m[0].title, description:$m[0].description, tags:$m[0].tags, fb_text:($m[0].description[0:2000]), ig_text:$ig, pinned_comment:$m[0].pinned_comment}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$HOOK"
      - name: Journal
        run: |
          git config user.name "de-auto"; git config user.email "de-auto@users.noreply.github.com"
          git add history.json log.csv topic.json used_clips.json 2>/dev/null || true
          git commit -m "Journal Short" || true
          git push || true
