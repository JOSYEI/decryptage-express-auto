name: Vidéo de présentation de la chaîne
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-roboto
      - run: pip install pillow edge-tts numpy
      - name: Montage
        env: { MODE: short, PRESENTATION: "1" }
        run: python render.py
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          D=$(ls -d out/*-short | tail -1)
          gh release create "presentation-$(date +%Y%m%d-%H%M)" "$D/video.mp4" "$D/cover.jpg" "$D/meta.json" "$D/subs.srt" --title "Présentation" --notes "Vidéo de présentation de la chaîne"
