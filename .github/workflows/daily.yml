name: Vidéo du jour
on:
  schedule:
    - cron: "0 5 * * *"   # 6h à Paris en hiver (7h en été)
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai sans clé ni voix réelle (true) ou production réelle (false)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow edge-tts
      - name: Choix du sujet
        run: python collect.py
      - name: Test de la voix gratuite (information)
        continue-on-error: true
        run: |
          python -m edge_tts --voice fr-FR-RemyMultilingualNeural --text "Bonjour" --write-media t.mp3 \
            && echo "VOIX_OK" || echo "VOIX_REFUSEE"
      - name: Production
        env:
          MOCK: ${{ inputs.essai && '1' || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OUT_DIR: out
        run: python produce.py
      - name: Publier les fichiers du jour (Release)
        run: |
          D=$(python -c "import json;print(json.load(open('topic.json'))['date'])")
          if [ -d "out/$D" ]; then
            cp modele_publication.json "out/$D/"
            TAG="video-$D"; [ "${{ inputs.essai }}" = "true" ] && TAG="essai-$D-${{ github.run_number }}"
            gh release create "$TAG" out/$D/* --title "$TAG" --notes "Fichiers du jour pour la publication."
          fi
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Mémoriser l'historique et le journal
        run: |
          git config user.name "de-auto"; git config user.email "de-auto@users.noreply.github.com"
          git add history.json log.csv topic.json 2>/dev/null || true
          git commit -m "Journal du jour" || true
          git push || true
